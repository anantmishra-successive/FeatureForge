<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>featureforge</title>
    <script>
      // Sets <html data-theme> before first paint so a reload never flashes the other theme.
      // The key and values must match THEME_STORAGE_KEY and Theme in src/features/theme/theme.ts.
      ;(function () {
        var theme = null
        try {
          var stored = window.localStorage.getItem('featureforge-theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        if (theme === null) {
          theme = 'light'
          try {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
          } catch (e) {}
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
